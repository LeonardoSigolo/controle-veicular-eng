spring.application.name=controle-veicular

# ---------------------------------------------------------------
# Banco de dados: PostgreSQL do Supabase
# Os dados de conexão vêm de VARIÁVEIS DE AMBIENTE (nunca escreva a senha aqui):
#   DB_URL      = jdbc:postgresql://<host-do-session-pooler>:5432/postgres?sslmode=require
#   DB_USER     = postgres.<ref-do-projeto>
#   DB_PASSWORD = <senha do banco>
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Poucas conexões: o pooler do Supabase tem limite de conexões
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate (o dialeto do PostgreSQL é detectado automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Servidor: a Vercel informa a porta pela variável PORT (padrão 80 no container)
server.port=${PORT:8080}
# Atrás do proxy da Vercel, respeita o https (necessário para o "Try it out" do Swagger)
server.forward-headers-strategy=framework
server.error.whitelabel.enabled=false
server.servlet.context-path=/
